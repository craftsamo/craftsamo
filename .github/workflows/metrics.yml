name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Achievements
        uses: dkhokhlov/metrics@master
        with:
          token: ${{ secrets.GH_TOKEN }}
          user: craftsamo
          template: classic
          filename: images/metrics-achievements.svg
          base: ""
          config_display: large
          plugin_achievements: yes
          plugin_achievements_threshold: C
          output_action: commit
          committer_message: "chore: update metrics (achievements)"
